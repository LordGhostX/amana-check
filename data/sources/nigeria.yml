country: NG
sources:
  - id: ncdc
    publisher: Nigeria Centre for Disease Control
    type: official
    tier: 1
    scope: [national]
    fetch:
      kind: html
      url: "https://ncdc.gov.ng/news/recent"
      link_pattern: "^/news/\\d+/"
      max_items: 10
    license: public
    refresh_interval: null
    enabled: true

  - id: ncdc-sitreps
    publisher: Nigeria Centre for Disease Control
    type: official
    tier: 1
    scope: [national]
    fetch:
      kind: html
      url: "https://ncdc.gov.ng/diseases/sitreps"
      link_pattern: "^/diseases/sitreps/\\?cat="
      max_items: 10
    license: public
    refresh_interval: null
    enabled: true

  - id: nan-ng
    publisher: News Agency of Nigeria
    type: official
    tier: 1
    scope: [national]
    fetch:
      kind: api
      url: "https://nannews.ng/wp-json/wp/v2/posts?per_page=100"
      max_items: 100
    license: public
    refresh_interval: null
    enabled: true

  - id: statehouse-ng
    publisher: State House Nigeria
    type: official
    tier: 1
    scope: [national]
