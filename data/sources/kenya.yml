country: KE
sources:
  - id: kenya-news-agency
    publisher: Kenya News Agency
    type: official
    tier: 1
    scope: [national]
    fetch:
      kind: api
      url: "https://www.kenyanews.go.ke/wp-json/wp/v2/posts?per_page=100"
      max_items: 100
    license: public
    refresh_interval: null
    enabled: true

  - id: president-ke
    publisher: Office of the President of Kenya
    type: official
    tier: 1
    scope: [national]
